# golangci-lint v2 config. Linter set: docs/05-go-conventions.md §3.
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - modernize
    - nilerr
    - nolintlint
    - perfsprint
    - revive
    - staticcheck
    - unused
    - usestdlibvars

  settings:
    depguard:
      rules:
        byte-fidelity:
          # ADR-0003: proxy/Replay/Automate traffic never goes through httputil.
          files:
            - $all
          deny:
            - pkg: net/http/httputil
              desc: normalizes requests; use internal/rawhttp (ADR-0003)
    nolintlint:
      # Rule 7 in AGENTS.md: every //nolint needs a reason.
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: error-return
        - name: receiver-naming
        - name: context-as-argument
        - name: context-keys-type
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    generated: strict
    presets:
      - std-error-handling
    paths:
      # Legacy Hetty code: kept compiling for reference only and deleted, moved
      # or rewritten in T-002 and later tasks. Not held to the new lint bar.
      - ^pkg/
      - ^cmd/hetty/
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pocikode/ratatoskr
  exclusions:
    paths:
      - ^pkg/
      - ^cmd/hetty/
